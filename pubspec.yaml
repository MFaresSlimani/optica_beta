name: bng_optica
description: "Optica: B2B network for optical stores to exchange lens and frame requests, built with Flutter, GetX and Supabase."
publish_to: 'none'

version: 1.3.0+3

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_thermal_printer: ^2.3.0
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  photo_view: ^0.15.0
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "#0B2C33"
  image: "assets/logo_small.png"
  android: true
  ios: true

flutter_icons:
  android: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/

  # Fonts are bundled (no runtime fetching): Manrope for Latin, IBM Plex Sans
  # Arabic and Noto Sans Tifinagh as fallbacks for Arabic and Tamazight.
  # All three are licensed under the SIL Open Font License (see assets/fonts).
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: NotoSansTifinagh
      fonts:
        - asset: assets/fonts/NotoSansTifinagh-Regular.ttf
