name: Release

# Publishes a GitHub Release with the release APK attached.
#
# How to release: bump `version:` in pubspec.yaml (e.g. 1.2.0+2 -> 1.3.0+3)
# and push to main. If no release exists yet for that version, this workflow
# tests, builds and publishes it as tag v1.3.0. Pushing a v* tag also works.
on:
  push:
    branches: [main]
    paths: [pubspec.yaml]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        run: |
          FULL=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${FULL%%+*}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$NAME" >/dev/null; then
            echo "Release v$NAME already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.version.outputs.skip == 'false'
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        if: steps.version.outputs.skip == 'false'
        run: flutter pub get

      - name: Test
        if: steps.version.outputs.skip == 'false'
        run: flutter test --exclude-tags screenshots

      # Optional: real signing key from repository secrets.
      # Without these secrets the APK is signed with the debug key.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: steps.version.outputs.skip == 'false' && env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        if: steps.version.outputs.skip == 'false'
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk "optica-${{ steps.version.outputs.tag }}.apk"

      - name: Publish GitHub Release
        if: steps.version.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Optica ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: optica-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
